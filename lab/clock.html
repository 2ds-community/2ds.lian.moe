<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Clock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 宽度撑满页面（移动端适配） -->
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        background: #181818;
      }
      #t {
        font-weight: 700; /* 粗细（权重） */
        font-size: 20vmin; /* 大小（屏幕缩放） */
        line-height: 1; /* 高度（没有间距） */
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; /* 字体及字体备选项 */
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <pre id="t">--:--:--</pre>
    <script>
      const t = document.getElementById("t");
      function z(n) {
        return String(n).padStart(2, "0");
      }

      function render() {
        const d = new Date();
        t.textContent = `${z(d.getHours())}:${z(d.getMinutes())}:${z(
          d.getSeconds()
        )}`;
      }
      function tick() {
        const ms = 1000 - new Date().getMilliseconds(); // 对齐整秒
        setTimeout(() => {
          render();
          tick();
        }, ms);
      }
      render();
      tick();
    </script>
    <noscript>请启用 JavaScript 以显示时钟。</noscript>
  </body>
</html>
